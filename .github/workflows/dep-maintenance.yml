name: Dependency Maintenance

on:
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC
  workflow_dispatch: # manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Update dependencies
        run: |
          bun update
          bun install --frozen-lockfile

      - name: Lint and build
        run: |
          bun run lint
          bun run build

      - name: Check for changes
        id: check
        run: |
          if git diff --name-only | grep -q .; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR
        if: steps.check.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="chore/weekly-deps-$(date +%Y-%m-%d)"
          git checkout -b $branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(deps): weekly dependency update"
          git push origin $branch --force
          gh pr create \
            --title "chore(deps): weekly dependency update" \
            --head $branch \
            --base main \
            --body "Automated weekly dependency update via \`bun update\`. Lint and build verified before opening."
