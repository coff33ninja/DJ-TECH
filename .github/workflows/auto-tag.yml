name: Auto Tag

on:
  push:
    branches: [main]
    paths: [package.json, bun.lock]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Configure git with push token
        env:
          PUSH_TOKEN: ${{ secrets.PUSH_TOKEN }}
        run: |
          if [ -z "$PUSH_TOKEN" ]; then
            echo "::error::Secret PUSH_TOKEN is not configured. Add a fine-grained PAT (Contents: read+write) to enable the release cascade."
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check existing tag
        id: check
        run: |
          if git ls-remote --tags origin v${{ steps.version.outputs.version }} 2>/dev/null | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.version.outputs.version }} already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag v${{ steps.version.outputs.version }}
          git push origin v${{ steps.version.outputs.version }}

      - name: Detect dependency-only change
        id: deps
        if: steps.check.outputs.exists == 'true'
        run: |
          prev="$(git show HEAD~1:package.json 2>/dev/null | node -p "try{require('fs').readFileSync(0,'utf8').match(/\"version\"\s*:\s*\"([^\"]+)\"/)[1]}catch(e){'0.0.0'}")"
          cur="${{ steps.version.outputs.version }}"
          echo "previous=$prev current=$cur"
          if [ "$prev" = "$cur" ]; then
            echo "deps_only=true" >> "$GITHUB_OUTPUT"
            echo "Dependency-only change (version $cur unchanged) -> patch release"
          else
            echo "deps_only=false" >> "$GITHUB_OUTPUT"
            echo "Version bumped ($prev -> $cur); normal tag path already handled it"
          fi

      - name: Patch release for dependency update
        if: steps.deps.outputs.deps_only == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only add the entry when [Unreleased] has no bullets yet (empty after a release).
          bullets="$(awk '/^## \[Unreleased\]/{f=1;next} f&&/^## \[/{exit} f{print}' CHANGELOG.md | grep -vE '^[[:space:]]*$' | grep -cE '^[-*]' || true)"
          echo "[Unreleased] bullet count: ${bullets:-0}"
          if [ "${bullets:-0}" -eq 0 ] && ! grep -qF "**Dependency updates**" CHANGELOG.md; then
            awk '
              /^## \[Unreleased\]$/ {
                print "## [Unreleased]"
                print ""
                print "### Changed"
                print ""
                print "- **Dependency updates** - applied latest dependency versions via weekly `bun update` / Dependabot."
                print ""
                next
              }
              { print }
            ' CHANGELOG.md > CHANGELOG.md.new && mv CHANGELOG.md.new CHANGELOG.md
            echo "Added dependency-update changelog entry"
          else
            echo "[Unreleased] already has entries; skipping changelog edit"
          fi

          bash scripts/push-and-release.sh
